version: 2

sources:
  - name: tennis_streaming
    description: "Streaming data from Pub/Sub to BigQuery"
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: tennis_streaming
    freshness:
      warn_after: { count: 12, period: hour }
      error_after: { count: 24, period: hour }
    loaded_at_field: ingested_at
    tables:
      - name: realtime_matches
        description: "Real-time match data ingested via Pub/Sub streaming"
        identifier: realtime_matches
        columns:
          - name: id
            description: "Unique match identifier"
            tests:
              - unique
              - not_null
          - name: tour
            description: "Tour (ATP or WTA)"
            tests:
              - not_null
              - accepted_values:
                  values: ['atp', 'wta']
          - name: tourney_date
            description: "Date of the tournament"
          - name: tourney_year
            description: "Year of the tournament"
          - name: winner_name
            description: "Winner player name"
          - name: loser_name
            description: "Loser player name"
          - name: winner_age
            description: "Winner age at match time"
          - name: loser_age
            description: "Loser age at match time"
          - name: surface
            description: "Court surface"
          - name: score
            description: "Match score"
          - name: ingested_at
            description: "Timestamp when data was ingested"
            tests:
              - not_null
          - name: data_source
            description: "Source of data (batch or streaming)"

      - name: match_stats_streaming
        description: "Match statistics aggregated from streaming data"
        identifier: match_stats_streaming
        columns:
          - name: id
            description: "Unique match identifier"
            tests:
              - unique
              - not_null
          - name: tour
            description: "Tour (ATP or WTA)"
          - name: tourney_year
            description: "Year of the tournament"
          - name: surface
            description: "Court surface"
          - name: ingested_at
            description: "Timestamp when data was ingested"
            tests:
              - not_null
